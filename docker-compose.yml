# Kilimanjaro Pazuri — production deployment.
#
#   docker compose up -d --build
#
# Caddy terminates TLS for pazuri.makutano.co.tz and proxies to this container
# over the shared `makutano-net` network, exactly as it does for Journeys and
# Connect. The app port is NOT published to the host: the only way in is
# through Caddy.

services:
  kilimanjaro-pazuri:
    build: .
    image: kilimanjaro-pazuri
    container_name: kilimanjaro-pazuri
    restart: unless-stopped

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      # Public origin. REQUIRED behind a proxy or SvelteKit's CSRF origin check
      # rejects every form POST.
      ORIGIN: ${PUBLIC_SITE_URL:-https://pazuri.makutano.co.tz}
      # Let adapter-node build correct https URLs from Caddy's forwarded headers.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      # So the enquiry rate limiter sees the visitor, not Caddy.
      ADDRESS_HEADER: X-Forwarded-For
      XFF_DEPTH: 1
      # The villa's rooms, enquiries and admin sessions live in Supabase.
      DATABASE_URL: ${DATABASE_URL}
      ADMIN_USERNAME: ${ADMIN_USERNAME}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}

    networks:
      - makutano-net

networks:
  makutano-net:
    external: true
